<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/reset.css" />
    <style>
        .contanier {
            position: relative;
            width: 280px;
            margin: 10px auto;
        }

        .menu {
            background-color: black;
            padding: 20px;

        }

        .menu ul li{
            display: inline;
            position: relative;
            margin-right: 20px;
        }

        .menu ul li a{
            color:#fff;
            font-weight: bold;
        }

        .sub-menu {
            position: absolute;
            left: 0px;
            width: 100px;
            background: #444;
            display: none;
        }

        .menu ul li:hover .sub-menu{
            display: block;
        }

        .sub-menu li a{
            padding: 10px;
            display: block;
        }

        .sub-menu li a:hover{
            background-color: #555;
        }

    </style>
</head>

<body>
    <div class="contanier">
        <div class="menu">
            <ul>
                <li><a href="#">홈</a></li>
                <li><a href="#">서비스</a>
                    <ul class="sub-menu">
                        <li><a href="#">웹 개발</a></li>
                        <li><a href="#">앱 개발</a></li>
                        <li><a href="#">디자인</a></li>
                    </ul>
                </li>
                <li><a href="#">소개</a></li>
                <li><a href="#">연락처</a></li>
            </ul>
        </div>
    </div>
</body>

</html>
