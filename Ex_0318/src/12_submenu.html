<!DOCTYPE html>
<html lang="ko">

	<head>
   	 	<meta charset="UTF-8">
    	<link rel="stylesheet" href="css/reset.css"/>
        <style>
            #nav{
                width: 1000px;
                height: 45px;
                padding: 6px 7px;
                background-color: #666;
                margin: 0 auto;
            }

            #nav > li{
                float: left;
                position: relative;
                margin: 3px 10px;
                margin-left: 80px;
            }

            #nav> li:first-child{
                margin-left: 200px;
            }

            #nav li a{
                display: block;
                font:bold  16px "고딕", sans-serif;
                color:#E7E5E5;
                padding: 5px;
            }

            #nav li:hover a{
                background-color: #fff;
                color: #444;
            }

            #nav ul{
                position: absolute;
                left: 0;
                top: 33px;
                width: 150px;
                border: 1px solid #b4b4b4;
                display: none;
            }

            #nav li:hover ul{
                display: block;
            }

            #nav ul a{
                color: #333;
            }

            #nav ul li:hover a{
                background-color: #ccc;
                color: #fff;
            }

        </style>
	</head>
