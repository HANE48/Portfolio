<!DOCTYPE html>
<html lang="ko">

	<head>
   	 	<meta charset="UTF-8">
    	<!-- <link rel="stylesheet" href="css/reset.css"/> -->
        <style>
            .normal{
                white-space: normal;
            }
            .nowrap{
                /* 줄바꿈을 없애고 옆으로 스크롤바를 만들어 넘김 */
                white-space: nowrap;
            }
            .pre{
                /* html의 규격을 무시하고 작성한 그대로를 출력 */
                white-space: pre;
            }
        </style>
	</head>

	<body>
        <p class="normal">공백문자의 처리를 위해서 white space를 사용한다.</p>
        <p class="nowrap">자동 줄바꿈이 아닐 때 nowrap를 통해서 한줄로 출력할 수 있다. 
            만일 웹브라우저를 넘어가는 너비라면 자동으로 스크롤을 생성해준다.</p>
        <p class="pre">
            for(int i=0 ; i<10 ; i++){
                Syso(i);
            }
        </p>
        <p>
            <pre>
                for(int i=0 ; i<10 ; i++){
                    Syso(i);
                }   
            </pre>
        </p>

    </body>

</html>
