<!DOCTYPE html>
<html lang="ko">

    <head>
        <meta charset="UTF-8">

    </head>
    <body>
        <!-- alt로 넣으면 이미지에 대한 설명을 넣을 수 있음 -->
        <img src="resources/images/background.jpg" 
            alt="이미지 설명"/>

        <!-- 마우스를 올렸을 때 나오는 툴팁에 title로 설명을 적을 수 있다. -->
        <img src="resources/images/float.jpg" alt="구름이 있는 사진" title="구름 이미지"/>

        
    </body>
</html>
