<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>
            블록 요소와 inline 요소
        </title>
    </head>
    <body>
        안녕하세요
        <!-- 볼드체를 만드는 <b> 태그 -->
        <!-- 줄이 바뀌는 태그: 블록요소 ex) <p>, <h>, <hr> -->
        <!-- 줄이 바뀌지 않는 태그: 인라인 요소 ex) <b>, <strong> -->
        <!-- <strong>태그는 소리내서 읽을때 더 강하게 읽어줌 -->
        <p>단락을 정의하는 <b>p 태그</b>는 <strong>블록</strong> 요소</p>
        <p>
            <!-- <em>태그도 <strong>처럼 강조해서 읽어줌 -->
            <!-- br : 강제 개행 태그 -->
            <!-- 원래는 <br>로 사용해도 되지만 리액트에서는 안되서 <br/>로 사용 -->
            <i>첫 번째 줄</i> <br/>
            <em>두 번째 줄</em> <br/>
            세 번째 줄
        </p>
        <p>
            <!-- target = "_blank"로 하면 새로운 창으로 열림 -->
            <a href="01_init.html" target="_blank">링크를 연결하는 a 태그</a>
            <a href="https://www.naver.com" target="_blank">링크</a>
            <!-- 단락을 바꿀때 사용하는 태그  수평선이 생김  -->
            <hr/>
            <!-- 연결할 곳이 정해지지 않은 a태그에는 임시링크 #을 넣어준다.  -->
            <a href="#">인라인 요소 태그</a>
        </p>
        
        
    </body> 
    
</html>
