<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <!-- <table> 태그는 <tr> <td>와 함께 사용함-->
        <!-- tr = talble row, td = table data -->
        <p>표 만들기(1행 1열)</p>
        <table border="1">
            <tr>
                <td style="background-color: aqua;">1행 1열</td>
            </tr>
           
        </table>


        <hr/>
        <p>1행 2열 만들기</p>
        <table border="1">
            <tr style="background-color: yellow;">
                <td>1행 1열</td>
                <td>1행 2열</td>
            </tr>
        </table>

        <hr/>

        <p>2행1열 행렬 만들기</p>
        <table border="1" style="background-color: black; color: white; border-color: yellow;">
            <tr>
                <td>1행 1열</td>
            </tr>
            <tr>
                <td>2행 1열</td>
            </tr>
        </table>

        <hr/>

        <p>2행2열 만들기</p>
        <table border="1" style="color: aqua; border-color: blueviolet;">
            <tr style="background-color: crimson;">
                <td>1,1</td>
                <td>1,2</td>
            </tr>
            <tr style="background-color: black;">
                <td>2,1</td>
                <td>2,2</td>
            </tr>
        </table>

        


    </body>
</html>
