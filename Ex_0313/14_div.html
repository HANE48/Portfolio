<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <!-- <p>태그는 기본적으로 margin을 16픽셀을 가지고 있음 -->
        <p>안녕하세요</p>
        <p>반갑습니다.</p>
        <!-- div는 margin을 안가지고있어 서로 붙어있음 -->
        <!-- 비슷한 영역에 위치한 요소들을 한번에 묶어서 관리하기 위한 용도이다.  -->
        <div style="background-color: #ff0000;">
            나는 div의 내용
        </div>
        <div>
            나도 div의 내용
        </div>

    </body>
</html>
