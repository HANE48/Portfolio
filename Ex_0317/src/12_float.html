<!DOCTYPE html>
<html lang="ko">
<!-- 정렬하는데 가장 중요한 요소 -->

<head>
    <meta charset="UTF-8">
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        #wrap{
            width: 430px;
            margin: 0 auto;
            background-color: black;
            border: 5px solid #f00;
        }

        #header{
            background-color: #09f;
            margin-bottom: 10px;
            padding: 10px 0;
            text-align: center;
            color: white;
        }

        #content{ 
            background-color: #ccc;
            margin-bottom:10px;
            overflow: hidden;
        }        

        #left{
            float:left;
            width:180px;
            height: 100px;
            background-color: #fcf;
            padding: 10px;
        }

        #right{
            float: left;
            width: 180px;
            background-color: #fff;
            height: 100px;
            padding: 10px;
            margin-left: 30px;
        }

        #footer{
            background-color: #33f;
            color: #FFF;
            padding: 10px 0;
            text-align: center;
        }

    </style>
</head>

<body>
    <div id="wrap">
        <div id="header">나는 Header</div>
        <div id="content">
            <div id="left">left</div>
            <div id="right">right</div>
        </div>
        <div id="footer">나는 Footer</div>
    </div>
</body>

</html>
