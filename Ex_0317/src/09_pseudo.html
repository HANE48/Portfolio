<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <style>
        /* 1번째 li를 말함 */
        li:first-child {
            color: red
        }

        /* li의 제일 밑에 자식 */
        li:last-child {
            color: blue
        }

        /* n번째 자식(n) */
        li:nth-child(odd) {
            color: pink;
        }

        li:nth-child(even) {
            color: green;
        }

        li:nth-child(4n){
            background:yellow;
        }

        li:nth-child(6){
            background-color: cyan;
        }
    </style>
</head>

<body>
    <ul>
        <!-- A -> first-child -->
        <li>A</li>
        <li>B</li>
        <li>C</li>
        <li>D</li>
        <li>E</li>
        <li>F</li>
        <li>G</li>
        <li>H</li>
    </ul>
    <ul>
        <li>A</li>
        <li>B</li>
        <li>C</li>
        <li>D</li>
    </ul>
</body>

</html>
