<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        p {
            border: 1px solid black;
            width: 100px;
            padding: 40px 0;
            text-align: center;
            /* 부모의 좌표를 기준으로 정렬(겹치게 됨) */
            position: absolute;
        }

        .box1 {
            background: yellow;
            left:100px;
            top:100px;
            /* 숫자가 큰 순으로 z-index가 위로 올라옴 
             * 겹쳐져 있는 요소들의 순서를 변경 
             * z-index값이 클 수록 위에 표시된다.
             */
            z-index: 3;
        }

        .box2 {
            background-color: orange;
            left: 120px;
            top: 120px;
            z-index: 2;
        }

        .box3 {
            background-color: teal;
            left: 140px;
            top: 140px;
        }
    </style>
</head>

<body>
    <p class="box1">박스 1</p>
    <p class="box2">박스 2</p>
    <p class="box3">박스 3</p>
</body>


</html>
