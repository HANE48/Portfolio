<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <style>
        p{
            width: 100px;
            padding: 10px;
            background-color: #69f;
        }

        .ww{
            /* 영단어의 경우 공백을 지정해도 짤리는 경우가 있어 너비에 맞춰 다음줄로 넘어가게 설정 */
            word-wrap: break-word;
        }

    </style>
</head>

<body>
    <p>
        이 문장은 매우 긴 단어를 포함하고 있습니다.<br/>
        aaaaaaaaaaaaaaaaaaaaaa aaaaaaaaaaaaaaaaaaaa
    </p>
    <p class="ww">
        이 문장은 매우 긴 단어를 포함하고 있습니다.<br/>
        aaaaaaaaaaaaaaaaaaaaa aaaaaaaaaaaaaaaaaaaaa
    </p>
</body>

</html>
