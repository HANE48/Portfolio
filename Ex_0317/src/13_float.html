<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        #main{
            background-color: black;
            border: 5px solid red;
            width: 500px;
            margin: 0 auto;
        }

        #head{
            background-color: #09f;
            margin-bottom: 10px;
            padding: 10px 0;
            text-align: center;
            color: white;
        }

        #body{
            background-color: #ccc;
            margin-bottom: 10px;
            overflow: hidden;
            text-align: center;
        }

        #left{
            float: left;
            width: 150px;
            height: 350px;
            background-color: #fcf;
            padding-right: 10px;
            margin-right: 10px;
        }

        #middle{
            float: left;
            width: 150px;
            height: 350px;
            background-color: #aaf;
        }

        #right{
            float: right;
            background-color: #fff;
            width: 170px;
            height: 350px;
            margin-left: 10px;
        }

        #foot{
            background-color: #33f;
            text-align: center;
            color: #FFF;
            padding: 10px;
        }

    </style>
</head>

<body>
    <div id = main>
        <div id="head">head</div>
        <div id="body">
            <div id="left">left</div>
            <div id="middle">middle</div>
            <div id="right">right</div>
        </div>
        <div id="foot">foot</div>
    </div>
</body>

</html>
