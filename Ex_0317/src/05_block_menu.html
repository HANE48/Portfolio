<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        ul {
            background-color: #ebebeb;
            border: 1px #cecece solid;
            text-align: center;
            margin: 10px auto;
            width: 130px;
        }

        li {
            list-style: none;
            margin: 7px;
        }

        a {
            text-decoration: none;
            color: black;
            display: block;
            padding: 5px;
            text-align: center;
            display: block;
        }

        a:hover {
            color: white;
            background-color: #000;
        }
    </style>
</head>

<body>
    <div>
        <ul>
            <li><a href="#">COMPANY</a></li>
            <li><a href="#">PRODUCT</a></li>
            <li><a href="#">SERVICE</a></li>
            <li><a href="#">COMMUNITY</a></li>
        </ul>
    </div>
</body>

</html>
