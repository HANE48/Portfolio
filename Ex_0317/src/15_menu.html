<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #menu {
            background: #333;
            overflow: hidden;
        }

        li {
            list-style: none;
        }

        #menu>li {
            float: left;
            text-align: center;
        }

        #menu li a {
            padding: 10px;
            color: #fff;
            text-decoration: none;
            /* a태그를 블록요소로 변환 */
            display: block;
        }

        #menu>li>a:hover {
            background: #555;
        }

        ul.sub-menu li a:hover {
            background: #aaf;
        }

        ul.sub-menu{
            position:absolute;
            background-color: #333;
            /* display: none는 현재 디스플레이를 숨김 */
            display: none;
        }

        /* 마우스 hover시 sub-menu에 대한 속성 지정 */
        #menu li:hover ul.sub-menu{
            display:block;
        }
    </style>
</head>

<body>
    <ul id="menu">
        <li>
            <a href="#">주메뉴 1</a>
            <ul class="sub-menu">
                <li><a href="#">하위메뉴 1-1</a></li>
                <li><a href="#">하위메뉴 1-2</a></li>
            </ul>
        </li>

        <li>
            <a href="#">주메뉴 2</a>
            <ul class="sub-menu">
                <li><a href="#">하위메뉴 2-1</a></li>
                <li><a href="#">하위메뉴 2-2</a></li>
                <li><a href="#">하위메뉴 2-3</a></li>

            </ul>
        </li>

        <li>
            <a href="#">주메뉴 3</a>
            <ul class="sub-menu">
                <li><a href="#">하위메뉴 3-1</a></li>
                <li><a href="#">하위메뉴 3-2</a></li>
                <li><a href="#">하위메뉴 3-3</a></li>
            </ul>
        </li>
    </ul>
</body>

</html>
